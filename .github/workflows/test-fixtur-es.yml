name: Test Fixtur.es Source

on:
  workflow_dispatch:

jobs:
  test-fixtur-es:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Fixtur.es adapter
        run: |
          python sources/fixtur_es.py
