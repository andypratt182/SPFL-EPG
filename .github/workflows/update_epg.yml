name: Update SPFL EPG

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevents two runs of this workflow from deploying to Pages at the
# same time -- a later run waits for an in-progress one to finish
# rather than racing it. cancel-in-progress is deliberately false: a
# scheduled run every 6 hours arriving mid-deployment should queue,
# not abort a deployment partway through and leave Pages in a
# half-updated state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # ------------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ------------------------------------------------------------
      # Generate XMLTV
      # ------------------------------------------------------------

      - name: Generate XMLTV
        run: |
          python generator.py


      # ------------------------------------------------------------
      # Upload warnings log (private run artifact -- not published
      # to the public Pages site, just downloadable from this run's
      # Actions summary for debugging venue/logo/fixture gaps)
      # ------------------------------------------------------------

      - name: Upload warnings log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warnings-log
          path: ./logs/warnings.log
          retention-days: 14
          if-no-files-found: ignore


      # ------------------------------------------------------------
      # Upload GitHub Pages artifact
      # ------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./output


      # ------------------------------------------------------------
      # Deploy GitHub Pages
      # ------------------------------------------------------------

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
